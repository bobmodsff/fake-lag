plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lgl.panel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lgl.panel'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '3.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

def webSource = rootProject.projectDir.parentFile.toPath().resolve('web').toFile()
def webAssets = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Copy) {
    from(webSource)
    into(webAssets)
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAssets'))
}
